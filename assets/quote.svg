<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200"><style>.q{opacity:0;animation:q 42s infinite}@keyframes q{0%{opacity:0}2.00%{opacity:1}14.67%{opacity:1}16.67%{opacity:0}100%{opacity:0}}.q0{animation-delay:0s}.q1{animation-delay:7s}.q2{animation-delay:14s}.q3{animation-delay:21s}.q4{animation-delay:28s}.q5{animation-delay:35s}.t{font:italic 24px Georgia,'Times New Roman',serif;fill:#e8e8e8;text-anchor:middle}.a{font:15px Georgia,'Times New Roman',serif;fill:#C41E3A;text-anchor:middle;letter-spacing:1px}</style><rect x="1" y="1" width="798" height="198" rx="14" fill="#0b0b0b" stroke="#3a0a12" stroke-width="2"/><rect x="10" y="10" width="780" height="180" rx="10" fill="none" stroke="#C41E3A" stroke-opacity=".35"/><g fill="#C41E3A" opacity=".8"><path transform="translate(22 22) scale(.9)" d="M10.5,2H13.5V8H19V11H13.5V22H10.5V11H5V8H10.5V2Z"/><path transform="translate(756 22) scale(.9)" d="M10.5,2H13.5V8H19V11H13.5V22H10.5V11H5V8H10.5V2Z"/><path transform="translate(22 156) scale(.9)" d="M10.5,2H13.5V8H19V11H13.5V22H10.5V11H5V8H10.5V2Z"/><path transform="translate(756 156) scale(.9)" d="M10.5,2H13.5V8H19V11H13.5V22H10.5V11H5V8H10.5V2Z"/></g><g class="q q0"><text class="t"><tspan x="400" y="95">All that we see or seem is but a dream within a dream.</tspan></text><text class="a" x="400" y="141">— Edgar Allan Poe</text></g><g class="q q1"><text class="t"><tspan x="400" y="95">Beware; for I am fearless, and therefore powerful.</tspan></text><text class="a" x="400" y="141">— Mary Shelley, Frankenstein</text></g><g class="q q2"><text class="t"><tspan x="400" y="79">Deep into that darkness peering, long I stood there,</tspan><tspan x="400" y="111">wondering, fearing.</tspan></text><text class="a" x="400" y="157">— Edgar Allan Poe, The Raven</text></g><g class="q q3"><text class="t"><tspan x="400" y="79">I have loved the stars too fondly</tspan><tspan x="400" y="111">to be fearful of the night.</tspan></text><text class="a" x="400" y="157">— Sarah Williams</text></g><g class="q q4"><text class="t"><tspan x="400" y="79">The boundaries which divide Life from Death are at best</tspan><tspan x="400" y="111">shadowy and vague.</tspan></text><text class="a" x="400" y="157">— Edgar Allan Poe</text></g><g class="q q5"><text class="t"><tspan x="400" y="79">We are such stuff as dreams are made on, and our little</tspan><tspan x="400" y="111">life is rounded with a sleep.</tspan></text><text class="a" x="400" y="157">— William Shakespeare</text></g></svg>
