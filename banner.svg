<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EC8F8"/>
      <stop offset="50%" stop-color="#A8E6F0"/>
      <stop offset="100%" stop-color="#9FF5D6"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F5FA8"/>
      <stop offset="100%" stop-color="#1A8C7A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .float { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 8s ease-in-out infinite reverse; }
      .twinkle { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: .4s } .d2 { animation-delay: .9s } .d3 { animation-delay: 1.4s } .d4 { animation-delay: 1.9s }
      .petal { animation: fall 9s linear infinite; }
      .p2 { animation-duration: 11s; animation-delay: -3s } .p3 { animation-duration: 13s; animation-delay: -6s } .p4 { animation-duration: 10s; animation-delay: -8s }
      .title { font: 800 64px 'Segoe UI', 'Trebuchet MS', sans-serif; letter-spacing: 2px; }
      .sub { font: 600 24px 'Segoe UI', 'Trebuchet MS', sans-serif; letter-spacing: 6px; }
      .jp { font: 700 30px 'Yu Gothic', 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      @keyframes tw { 0%,100% { opacity: .25; transform: scale(.7) } 50% { opacity: 1; transform: scale(1.15) } }
      @keyframes fall { 0% { transform: translate(0,-40px) rotate(0) } 100% { transform: translate(-160px,420px) rotate(360deg) } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#sky)"/>

  <!-- soft sun / halo -->
  <circle cx="980" cy="90" r="120" fill="#ffffff" opacity=".25"/>
  <circle cx="980" cy="90" r="70" fill="#ffffff" opacity=".35"/>

  <!-- clouds -->
  <g class="float" fill="#ffffff" opacity=".85">
    <ellipse cx="160" cy="270" rx="120" ry="38"/>
    <ellipse cx="110" cy="250" rx="60" ry="40"/>
    <ellipse cx="200" cy="245" rx="70" ry="48"/>
  </g>
  <g class="float2" fill="#ffffff" opacity=".7">
    <ellipse cx="1030" cy="300" rx="140" ry="36"/>
    <ellipse cx="980" cy="280" rx="70" ry="42"/>
    <ellipse cx="1080" cy="275" rx="64" ry="40"/>
  </g>

  <!-- falling petals (mint/white) -->
  <g fill="#E6FFF5">
    <path class="petal" d="M300 0 q8 -10 16 0 q-8 14 -16 0z"/>
    <path class="petal p2" d="M620 0 q8 -10 16 0 q-8 14 -16 0z"/>
    <path class="petal p3" d="M880 0 q8 -10 16 0 q-8 14 -16 0z"/>
    <path class="petal p4" d="M1100 0 q8 -10 16 0 q-8 14 -16 0z"/>
    <path class="petal p3" d="M450 0 q8 -10 16 0 q-8 14 -16 0z"/>
  </g>

  <!-- sparkles -->
  <g fill="#ffffff">
    <path class="twinkle" d="M90 70 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6z"/>
    <path class="twinkle d1" d="M330 60 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z"/>
    <path class="twinkle d2" d="M1060 190 l5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5z"/>
    <path class="twinkle d3" d="M1130 50 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4z"/>
    <path class="twinkle d4" d="M260 180 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
    <path class="twinkle d1" d="M760 70 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z"/>
  </g>

  <!-- text -->
  <g text-anchor="middle" filter="url(#glow)">
    <text class="jp" x="600" y="110" fill="#2E7FB8">✦ ようこそ ✦</text>
    <text class="title" x="600" y="190" fill="url(#txt)">Hi, I'm Aziretzz</text>
    <text class="sub" x="600" y="240" fill="#2B6F8A">DEVELOPER · DREAMER · ANIME ENJOYER</text>
  </g>
</svg>
